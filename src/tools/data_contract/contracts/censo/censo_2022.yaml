raw_data:
  - contractName: districts_2022.yaml
    tableName: districts_2022
    schema:
    physicalPath: raw_data/censo/layers/2022/distritos/
    description: Municipality geometry layer from the 2022 Census
    queryYears: 2022
    ifExists: append

  - contractName: mun_2022.yaml
    tableName: mun_2022
    schema:
    physicalPath: raw_data/censo/layers/2022/municipios/
    description: Municipality geometry layer from the 2022 Census
    queryYears: 2022
    ifExists: append

  - contractName: sectors_2022.yaml
    tableName: sectors_2022
    schema: layers
    physicalPath: raw_data/censo/layers/2022/setores_censitarios/
    description: Census sectors geometry layer from the 2022 Census
    queryYears: 2022
    ifExists: replace

  - contractName: subdistricts_2022.yaml
    tableName: subdistricts_2022
    schema:
    physicalPath: raw_data/censo/layers/2022/subdistritos/
    description: Municipality geometry layer from the 2022 Census
    queryYears: 2022
    ifExists: append

  - contractName: dompp_2022.yaml
    tableName: dompp_2022
    schema: layers
    physicalPath: raw_data/censo/layers/2022/dompp/
    description: Domicile mapped by lat/long from the 2022 Census
    queryYears: 2022
    ifExists: append

  - contractName: states_2022.yaml
    tableName: states_2022
    schema: layers
    physicalPath: raw_data/censo/layers/2022/estados/
    description: States geometry layer from the 2022 Census
    queryYears: 2022
    ifExists: append

