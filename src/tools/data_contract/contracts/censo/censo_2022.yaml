    description: Districts geometry layer from the 2022 Census (same table of raw_data)
    queryYears: 2022
    ifExists: append

  - contractName: mun_2022.yaml
    tableName: mun_2022
    schema: layers
    physicalPath: databases/bronze/censo/layers/2022/municipios/
