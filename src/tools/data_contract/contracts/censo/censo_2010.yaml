raw_data:
  - contractName: districts_2010.yaml
    tableName: districts_2010
    schema:
    physicalPath: raw_data/censo/layers/2010/distritos/
    description: Municipality geometry layer from the 2010 Census
    queryYears: 2010
    ifExists: append

  - contractName: mun_2010.yaml
    tableName: mun_2010
    schema:
    physicalPath: raw_data/censo/layers/2010/municipios/
    description: Municipality geometry layer from the 2010 Census
    queryYears: 2010
    ifExists: append

  - contractName: sectors_2010.yaml
    tableName: sectors_2010
    schema: layers
    physicalPath: raw_data/censo/layers/2010/setores_censitarios/
    description: Census sectors geometry layer from the 2010 Census
    queryYears: 2010
    ifExists: replace

  - contractName: subdistricts_2010.yaml
    tableName: subdistricts_2010
    schema:
    physicalPath: raw_data/censo/layers/2010/subdistritos/
    description: Municipality geometry layer from the 2010 Census
    queryYears: 2010
    ifExists: append

