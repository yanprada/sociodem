bronze:
  tableName: ucbt
  schema: infrastructure
  physicalPath: databases/{medallon}/aneel/
  description: Energy infrastructure consumption for energy companies
  queryYear: Null
  ifExists: append
  columns:
  - column: pn_con
    isPrimaryKey: False
    ForeignKey: bronze.infrastructure.ponnot (cod_id)
    businessName: Infrastructure point ID
    description: Unique identifier of the company power pole
    logicalTye: int
    physicalType: int
    isNullable: False
    isBlank: False
    translatedValues:
    sampleValues:
    - 48
    - 51
  - column: dist
    isPrimaryKey: False
    ForeignKey: 
    businessName: Company ID
    description: Unique identifier of the company 
    logicalTye: int
    physicalType: int
    isNullable: False
    isBlank: False
    translatedValues:
    sampleValues:
    - 7883
    - 7886
  - column: clas_sub
    isPrimaryKey: False
    ForeignKey: 
    businessName: Power pole consumption type
    description: Power pole consumption type depending on the area
    logicalTye: str
    physicalType: varchar(36)
    isNullable: False
    isBlank: False
    translatedValues:
      "0": Não informado
      RE1: Residencial
      RE2: Residencial baixa renda
      RE3: Residencial baixa renda indígena
      RE4: Residencial baixa renda quilombola
      RE5: Residencial baixa renda benefício de prestação continuada da assistência social
      RE6: Residencial baixa renda multifamiliar
      IN: Industrial
      CO1: Comercial
      CO2: Serviços de transporte, exceto tração elétrica
      CO3: Serviços de comunicações e telecomunicações
      CO4: Associação e entidades filantrópicas
      CO5: Templos religiosos
      CO6: Administração condominial (iluminação e instalações de uso comum de prédio ou conjunto de edificações)
      CO7: Iluminação em rodovias (solicitada por quem detenha concessão ou autorização para administração em rodovias)
      CO8: Semáforos, radares e câmeras de monitoramento de trânsito, solicitados por quem detenha concessão ou autorização para controle de trânsito
      CO9: Outros serviços e outras atividades
      RU1: Agropecuária rural
      RU1A: Agropecuária rural (poços de captação de água, para atender finalidades de que trata este inciso, desde que não haja comercialização da água)
      RU1B: Agropecuária rural (serviço de bombeamento de água destinada à atividade de irrigação)
      RU2: Agropecuária urbana
      RU3: Residencial rural
      RU4: Cooperativa de eletrificação rural
      RU5: Agroindustrial
      RU6: Serviço público de irrigação rural
      RU7: Escola agrotécnica
      RU8: Aquicultura
      PP1: Poder público federal
      PP2: Poder público estadual ou distrital
      PP3: Poder público municipal
      IP: Iluminação pública
      SP1: Tração elétrica
      SP2: Água, esgoto e saneamento
      CPR: Consumo próprio pela distribuidora
      CPRVE: Consumo próprio pela distribuidora para estação de recarga de veículos elétricos
      CSPS: Concessionária ou Permissionária
    sampleValues:
    - RU6
    - SP1
    - CO2
  - column: mun
    isPrimaryKey: False
    ForeignKey: 
    businessName: Municipality code
    description: Municipality code where is the power pole
    logicalTye: str
    physicalType: varchar(36)
    isNullable: False
    isBlank: False
